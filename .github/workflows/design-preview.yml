name: Eneida design preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/src/effects/**'
      - 'app/build.gradle.kts'
      - 'tools/capture-design.py'
      - '.github/workflows/design-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build effects APK
        run: |
          gradle --no-daemon --console=plain :app:assembleEffects
          cp app/build/outputs/apk/effects/app-effects.apk Eneida-0.9.5-fx.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Android 16 screens
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/capture-design.py
      - name: Upload design preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eneida-0.9.5-fx
          path: |
            Eneida-0.9.5-fx.apk
            artifacts/design/
          overwrite: true
          retention-days: 14
          if-no-files-found: error
