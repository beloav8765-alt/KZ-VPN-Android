name: Build Eneida UI Prototype APK

on:
  push:
    branches:
      - eneida-ui-s25-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --console=plain :eneidaUi:assembleDebug

      - name: Verify launcher metadata
        shell: bash
        run: |
          APK="eneidaUi/build/outputs/apk/debug/eneidaUi-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='dev.eneida.prototype.desktop.v2'" apk-badging.txt
          grep -F "launchable-activity: name='dev.eneida.prototype.MainActivity'" apk-badging.txt

      - name: Package prototype APK
        shell: bash
        run: cp eneidaUi/build/outputs/apk/debug/eneidaUi-debug.apk Eneida-Desktop-S25-Ultra-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eneida-Desktop-S25-Ultra-v2
          path: Eneida-Desktop-S25-Ultra-v2.apk
          if-no-files-found: error
          retention-days: 14
