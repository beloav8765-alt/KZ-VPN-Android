name: Build Eneida APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Check Eneida control plane syntax
        shell: bash
        run: python -m py_compile control-plane/app/main.py control-plane/app/fleet.py

      - name: Check Eneida agent syntax
        shell: bash
        run: python -m py_compile agent/agent.py

      - name: Build APK
        shell: bash
        env:
          ENEIDA_API_BASE_URL: ${{ vars.ENEIDA_API_BASE_URL }}
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk Eneida-0.9.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eneida-0.9.2-debug
          path: Eneida-0.9.2-debug.apk
          if-no-files-found: error
          retention-days: 14
